name: Dump libgame.so Functions

on:
  workflow_dispatch:
  push:
    paths:

jobs:
  ghidra-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Ghidra
        run: |
          wget -q https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.0.1_build/ghidra_11.0.1_PUBLIC_20240130.zip
          unzip -q ghidra_11.0.1_PUBLIC_20240130.zip
          echo "GHIDRA_INSTALL_DIR=$PWD/ghidra_11.0.1_PUBLIC" >> $GITHUB_ENV

      - name: Create output directories and Ghidra script
        run: |
          mkdir -p output
          mkdir -p ghidra_scripts
          cat > ghidra_scripts/ListFunctions.py << 'EOF'
          # Ghidra script to export function list (Python 2 / Jython compatible)
          # @category: Analysis
          # @menupath: Tools.Export Function List
          # @description: Exports list of functions with addresses, names, sizes, and signatures to CSV.

          import csv
          import os
          import errno

          program = getCurrentProgram()
          function_manager = program.getFunctionManager()
          functions = function_manager.getFunctions(True)  # true = forward

          output_dir = os.environ.get('GITHUB_WORKSPACE', '.') + '/output'
          try:
              os.makedirs(output_dir)
          except OSError as e:
              if e.errno != errno.EEXIST:
                  raise

          csv_file = os.path.join(output_dir, 'functions.csv')

          count = 0
          with open(csv_file, 'w') as f:
              writer = csv.writer(f)
              writer.writerow(['Address', 'Name', 'Size', 'Signature'])
              for func in functions:
                  addr = func.getEntryPoint()
                  name = func.getName()
                  size = func.getBody().getNumAddresses()
                  sig = func.getSignature().getPrototypeString()
                  writer.writerow([addr, name, size, sig])
                  count += 1

          print('Exported {} functions to {}'.format(count, csv_file))
          EOF

      - name: Run Ghidra headless analysis
        run: |
          mkdir -p ghidra_project
          $GHIDRA_INSTALL_DIR/support/analyzeHeadless ghidra_project project1 -import libgame.so -scriptPath ghidra_scripts -postScript ListFunctions.py -deleteProject

      - name: Upload function list artifact
        uses: actions/upload-artifact@v4
        with:
          name: libgame-functions
          path: output/functions.csv
