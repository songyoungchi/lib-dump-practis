name: Dump libgame.so functions with Ghidra

on:
  push:
    paths:
      - 'libgame.so'          # Trigger only when libgame.so changes
  workflow_dispatch:          # Allow manual runs

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download and extract Ghidra
        run: |
          wget -q https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.0.2_build/ghidra_11.0.2_PUBLIC_20240109.zip
          unzip -q ghidra_11.0.2_PUBLIC_20240109.zip -d ghidra
          echo "GHIDRA_HOME=$PWD/ghidra/ghidra_11.0.2_PUBLIC" >> $GITHUB_ENV

      - name: Create Ghidra script to dump functions
        run: |
          cat > dump_functions.py << 'EOF'
          # Ghidra script: exports all functions (address, name, size, signature)
          from ghidra.program.model.listing import Function
          import os

          output_path = os.path.join(os.environ["GITHUB_WORKSPACE"], "functions_output.txt")
          fm = currentProgram.getFunctionManager()
          functions = fm.getFunctions(True)   # forward iteration

          with open(output_path, "w") as f:
              f.write("Address\tName\tSize\tSignature\n")
              for func in functions:
                  try:
                      sig = func.getSignature().getPrototypeString()
                  except:
                      sig = "N/A"
                  addr = func.getEntryPoint()
                  name = func.getName()
                  size = func.getBody().getNumAddresses()
                  f.write(f"{addr}\t{name}\t{size}\t{sig}\n")

          print("Dumped {} functions to {}".format(fm.getFunctionCount(), output_path))
          EOF
          echo "SCRIPT_PATH=$PWD/dump_functions.py" >> $GITHUB_ENV

      - name: Run Ghidra headless analysis
        run: |
          mkdir -p ghidra_projects
          $GHIDRA_HOME/support/analyzeHeadless ghidra_projects project1 \
            -import libgame.so \
            -overwrite \
            -scriptPath $GITHUB_WORKSPACE \
            -postScript dump_functions.py \
            -deleteProject

      - name: Upload functions output
        uses: actions/upload-artifact@v4
        with:
          name: libgame-functions
          path: functions_output.txt
