name: Ghidra libgame.so Analyzer

on:
  workflow_dispatch:
    inputs:
      lib_url:
        description: 'Optional URL to download libgame.so (raw link)'
        required: false
        type: string
  push:
    paths:
      - 'libgame.so'
      - 'libs/**'
      - '.github/workflows/**'

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      # ---------- Setup ----------
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils file unzip wget git

      - name: Cache Ghidra
        id: cache-ghidra
        uses: actions/cache@v4
        with:
          path: ghidra
          key: ghidra-11.1.2-${{ runner.os }}

      - name: Download Ghidra
        if: steps.cache-ghidra.outputs.cache-hit != 'true'
        run: |
          set -e
          GHIDRA_VERSION=11.1.2
          GHIDRA_DATE=20240709
          wget -q "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${GHIDRA_VERSION}_build/ghidra_${GHIDRA_VERSION}_PUBLIC_${GHIDRA_DATE}.zip" -O ghidra.zip
          unzip -q ghidra.zip
          mv "ghidra_${GHIDRA_VERSION}_PUBLIC" ghidra
          rm -f ghidra.zip

      - name: Export GHIDRA_HOME
        run: echo "GHIDRA_HOME=$PWD/ghidra" >> $GITHUB_ENV

      # ---------- Locate target ----------
      - name: Obtain libgame.so
        run: |
          set -e
          if [ -n "${{ inputs.lib_url }}" ]; then
            echo "[*] Downloading from URL..."
            wget -q "${{ inputs.lib_url }}" -O libgame.so
          fi
          LIB=$(find . -name 'libgame.so' -type f | head -n1)
          if [ -z "$LIB" ]; then
            echo "::error::libgame.so was not found in repository nor downloaded."; exit 1
          fi
          echo "LIB=$PWD/$LIB" >> $GITHUB_ENV
          echo "[+] Found target: $LIB"
          file "$LIB"

      # ---------- Pre-analysis: ELF + strings ----------
      - name: Basic ELF extraction
        run: |
          set -e
          mkdir -p output
          file "$LIB"                              > output/01_file.txt          || true
          readelf -h "$LIB"                        > output/02_elf_header.txt   || true
          readelf -S "$LIB"                        > output/03_sections.txt     || true
          readelf -d "$LIB"                        > output/04_dynamic.txt      || true
          readelf -lW "$LIB"                       > output/05_segments.txt     || true
          readelf -sW "$LIB"                       > output/06_symbols.txt      || true
          readelf -rW "$LIB"                       > output/07_relocations.txt  || true
          nm -D "$LIB"                             > output/08_nm_dynamic.txt   || true
          nm -C "$LIB"                             > output/09_nm_demangled.txt || true
          objdump -T "$LIB"                        > output/10_objdump_T.txt    || true

      - name: Extract strings & JNI
        run: |
          set -e
          strings -a -t x "$LIB" > output/20_strings_all.txt || true
          strings -a -t x "$LIB" | grep -iE 'Java_[a-zA-Z_]+' > output/21_jni_exports.txt || true
          strings -a "$LIB" | grep '^Java_' | sort -u > output/22_jni_methods.txt || true
          strings -a "$LIB" | grep -iE 'fuel|player|save|load|coin|money|score|garage|vehicle|upgrade|stage|iap|purchase' \
              | sort -u > output/23_interesting_strings.txt || true
          strings -a "$LIB" | grep -i cocos | sort -u > output/24_cocos_strings.txt || true
          strings -a "$LIB" | grep -iE 'xxtea|tea|decrypt|encrypt' | sort -u > output/25_crypto_strings.txt || true

      # ---------- Write custom scripts ----------
      - name: Write Ghidra scripts
        run: |
          set -e
          mkdir -p ghidra_scripts

          # ---- DumpInfo.py ----
          cat > ghidra_scripts/DumpInfo.py <<'PYEOF'
          #@category HCR
          #@runtime Jython
          import os

          def out_path(name):
              d = os.environ.get('OUT_DIR', 'output')
              if not os.path.exists(d):
                  os.makedirs(d)
              return os.path.join(d, name)

          with open(out_path('30_memory_blocks.txt'), 'w') as f:
              for b in currentProgram.getMemory().getBlocks():
                  f.write("%s\t%s\t%s\t%d\n" % (b.getName(), b.getStart(), b.getEnd(), b.getSize()))

          with open(out_path('31_imports.txt'), 'w') as f:
              for sym in currentProgram.getSymbolTable().getExternalSymbols():
                  f.write("%s\n" % sym.getName())

          with open(out_path('32_defined_strings.txt'), 'w') as f:
              for data in currentProgram.getListing().getDefinedData(True):
                  try:
                      val = data.getValue()
                  except:
                      val = None
                  if val is not None and isinstance(val, str) and len(val) >= 4:
                      f.write("%s\t%s\n" % (data.getAddress(), val.replace('\n', '\\n')))

          print("[DumpInfo] done")
          PYEOF

          # ---- RenameFunctionsWithStrings.py ----
          cat > ghidra_scripts/RenameFunctionsWithStrings.py <<'PYEOF'
          #@category HCR
          #@runtime Jython
          import re
          from ghidra.program.model.symbol import SourceType

          def sanitize(s):
              s = re.sub(r'[^A-Za-z0-9_]', '_', s)
              s = re.sub(r'_+', '_', s).strip('_')
              if len(s) > 50:
                  s = s[:50]
              if not s or s[0].isdigit():
                  s = 's_' + s
              return s

          def is_default_name(n):
              return (n.startswith('FUN_') or n.startswith('func_') or
                      n.startswith('thunk_') or n.startswith('LAB_') or
                      n.startswith('sub_')  or n.startswith('FID_'))

          fm = currentProgram.getFunctionManager()
          listing = currentProgram.getListing()
          st = currentProgram.getSymbolTable()

          funcs = list(fm.getFunctions(True))
          total = len(funcs)
          print("[Rename] total functions: %d" % total)

          renamed = 0
          processed = 0
          used = set()

          for func in funcs:
              processed += 1
              if processed % 1000 == 0:
                  print("[Rename] %d/%d | renamed so far: %d" % (processed, total, renamed))

              name = func.getName()
              if not is_default_name(name):
                  continue

              body = func.getBody()
              if body is None:
                  continue

              strings_found = []
              try:
                  instrs = listing.getInstructions(body, True)
                  count = 0
                  for instr in instrs:
                      count += 1
                      if count > 30000:
                          break
                      try:
                          refs = instr.getReferencesFrom()
                      except:
                          continue
                      for ref in refs:
                          try:
                              to_addr = ref.getToAddress()
                          except:
                              continue
                          data = getDataAt(to_addr)
                          if data is None:
                              continue
                          try:
                              val = data.getValue()
                          except:
                              val = None
                          if val is None or not isinstance(val, str):
                              continue
                          if len(val) < 4 or len(val) > 80:
                              continue
                          if not val.strip():
                              continue
                          strings_found.append(val)
              except:
                  continue

              if not strings_found:
                  continue

              strings_found.sort(key=lambda s: (0 if any(c.isalpha() for c in s) else 1, len(s)))
              base = sanitize(strings_found[0])
              if len(base) < 3:
                  continue

              new_name = 'str_' + base
              candidate = new_name
              suffix = 0
              while candidate in used or st.getSymbol(candidate) is not None:
                  suffix += 1
                  if suffix > 500:
                      break
                  candidate = "%s_%d" % (new_name, suffix)
              if suffix > 500:
                  continue

              try:
                  func.setName(candidate, SourceType.USER_DEFINED)
                  used.add(candidate)
                  renamed += 1
              except:
                  pass

          print("[Rename] DONE. renamed=%d" % renamed)
          PYEOF

          # ---- ExportFunctions.py ----
          cat > ghidra_scripts/ExportFunctions.py <<'PYEOF'
          #@category HCR
          #@runtime Jython
          import os

          def out_path(name):
              d = os.environ.get('OUT_DIR', 'output')
              if not os.path.exists(d):
                  os.makedirs(d)
              return os.path.join(d, name)

          fm = currentProgram.getFunctionManager()
          with open(out_path('40_functions.txt'), 'w') as f:
              for func in fm.getFunctions(True):
                  try:
                      size = func.getBody().getNumAddresses()
                  except:
                      size = 0
                  f.write("%s\t%s\t%d\n" % (func.getEntryPoint(), func.getName(), size))

          keys = ['fuel','player','save','load','coin','money','score',
                  'garage','vehicle','upgrade','stage','iap','purchase',
                  'reward','boost','tune','part']
          with open(out_path('41_functions_interesting.txt'), 'w') as f:
              for func in fm.getFunctions(True):
                  n = func.getName().lower()
                  if any(k in n for k in keys):
                      f.write("%s\t%s\n" % (func.getEntryPoint(), func.getName()))

          print("[ExportFunctions] done")
          PYEOF

          # ---- ExportDecompiled.py ----
          cat > ghidra_scripts/ExportDecompiled.py <<'PYEOF'
          #@category HCR
          #@runtime Jython
          import os
          from ghidra.app.decompiler import DecompInterface

          base = os.environ.get('OUT_DIR', 'output')
          out_dir = os.path.join(base, 'decompiled')
          if not os.path.exists(out_dir):
              os.makedirs(out_dir)

          KEYS = ['fuel','player','save','load','coin','money','score',
                  'garage','vehicle','upgrade','stage','iap','purchase',
                  'reward','boost','tune','part']

          fm = currentProgram.getFunctionManager()
          targets = []
          for func in fm.getFunctions(True):
              n = func.getName().lower()
              if any(k in n for k in KEYS):
                  targets.append(func)

          print("[Decompile] interesting functions: %d" % len(targets))

          decomp = DecompInterface()
          decomp.openProgram(currentProgram)

          count = 0
          for func in targets:
              try:
                  res = decomp.decompileFunction(func, 60, monitor)
                  if res and res.decompileCompleted():
                      code = res.getDecompiledFunction().getC()
                      safe = func.getName().replace('/','_').replace('<','_').replace('>','_').replace(' ','_')
                      path = os.path.join(out_dir, "%s_%s.c" % (func.getEntryPoint(), safe))
                      with open(path, 'w') as f:
                          f.write("// %s @ %s\n\n" % (func.getName(), func.getEntryPoint()))
                          f.write(code)
                      count += 1
              except:
                  pass

          print("[Decompile] wrote %d files" % count)
          PYEOF

          ls -la ghidra_scripts

      # ---------- Run Ghidra Headless ----------
      - name: Run Ghidra headless analysis + scripts
        env:
          OUT_DIR: ${{ github.workspace }}/output
        run: |
          set -e

          # پروژه باید والدش وجود داشته باشه
          mkdir -p "$GITHUB_WORKSPACE/ghidra_proj"
          mkdir -p "$OUT_DIR"

          echo "[*] Ghidra home: $GHIDRA_HOME"
          echo "[*] LIB: $LIB"
          echo "[*] Script path: $GITHUB_WORKSPACE/ghidra_scripts"
          ls -la "$GITHUB_WORKSPACE/ghidra_scripts"

          "$GHIDRA_HOME/support/analyzeHeadless" \
            "$GITHUB_WORKSPACE/ghidra_proj" \
            HCRProj \
            -import "$LIB" \
            -scriptPath "$GITHUB_WORKSPACE/ghidra_scripts" \
            -postScript DumpInfo.py \
            -postScript RenameFunctionsWithStrings.py \
            -postScript ExportFunctions.py \
            -postScript ExportDecompiled.py \
            -analysisTimeoutPerFile 7200

      # ---------- Post-processing ----------
      - name: Post-process output
        run: |
          set -e
          [ -f output/40_functions.txt ] && sort -u output/40_functions.txt -o output/40_functions.txt || true
          [ -f output/41_functions_interesting.txt ] && sort -u output/41_functions_interesting.txt -o output/41_functions_interesting.txt || true

          {
            echo "=== libgame.so Analysis Summary ==="
            echo
            echo "--- File ---"
            cat output/01_file.txt || true
            echo
            echo "--- Functions total ---"
            wc -l output/40_functions.txt 2>/dev/null || echo "n/a"
            echo
            echo "--- Interesting functions ---"
            wc -l output/41_functions_interesting.txt 2>/dev/null || echo "n/a"
            echo
            echo "--- JNI methods (Java_*) ---"
            wc -l output/22_jni_methods.txt 2>/dev/null || echo "n/a"
            echo
            echo "--- Interesting strings ---"
            wc -l output/23_interesting_strings.txt 2>/dev/null || echo "n/a"
            echo
            echo "--- Decompiled files ---"
            ls output/decompiled 2>/dev/null | wc -l || echo "n/a"
          } | tee output/00_SUMMARY.txt

          tar -czf libgame-analysis.tar.gz output/

      # ---------- Cleanup ----------
      - name: Cleanup project dir
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/ghidra_proj" || true

      # ---------- Upload artifacts ----------
      - name: Upload full analysis
        uses: actions/upload-artifact@v4
        with:
          name: libgame-analysis
          path: |
            output/
            libgame-analysis.tar.gz
          retention-days: 30
          if-no-files-found: error
